syntax = "proto3";

message DanmakuElem {
    int64 id = 1;
    int32 progress = 2;
    int32 mode = 3;
    int32 fontsize = 4;
    uint32 color = 5;
    string mid_hash = 6;
    string content = 7;
    int64 ctime = 8;
    int32 weight = 9;
    string action = 10;
    int32 pool = 11;
    string dmid_str = 12;
    int32 attr = 13;
}

message DanmakuSegment {
    repeated DanmakuElem elems = 1;
}
